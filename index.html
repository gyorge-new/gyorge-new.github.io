<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyorge - Boas-vindas</title>
    <!-- Style -->
    <link rel="shortcut icon" href="./imgs/logo.png">
    <link rel="stylesheet" href="style.css">

    <!-- Fontes do Google -->


</head>
<body>
    <div id="show">
        <div id="title">
                Bem-vindo ao meu site!
            <div id="title-mod">O site do Gyorge</div>
        </div>
        <div id="paglist">
            Descubra mais sobre mim 
            <grid></grid>
        </div>
    </div>

    <!-- Iframe -->
    <iframe id="iframe" src="about:blank" frameborder="0"></iframe>
    <div id="divMusic">
        <audio id="bgMusic">
            <source id="musicSource" src="musicas/Dead Voxel.mp3" type="audio/mpeg">
        </audio>

        <button id="ocultar-audio" onclick="esconderBarra(false,this)"></button>      
        <div id="controles-play">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="controls-wrapper">
                <p>Player de músicas</p>
                <div id="playback-controls">
                    <button onclick="togglePlay(music,this)" id="playBtn" title="Play/Pause"></button>
                    <button onclick="toggleMute(music,this)" id="muteBtn" title="Mudar Volume"></button>
                </div>
                <p id="musicName">Dead Voxel -- Minecraft: C418</p>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="jscript/functions.js"></script>
    <script src="jscript/init.js"></script>
    <script src="jscript/events.js"></script>
</body>
</html>
